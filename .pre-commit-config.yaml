# Run with prek, which stashes unstaged changes so only staged content is checked.
# The hook runs the project's own tools through uv, so their versions come from
# uv.lock instead of a separate rev pin here.
repos:
  - repo: local
    hooks:
      - id: doit-check
        name: doit check
        entry: uv run --frozen doit check test
        language: system
        pass_filenames: false
        always_run: true
