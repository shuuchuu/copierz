[project]
authors = [
  {name = "m09", email = "142691+m09@users.noreply.github.com"},
]
dependencies = [
  "copier >= 9.9, < 10",
  "packaging >= 24",
  "pyyaml >= 6, < 7",
  "rich >= 13",
]
description = "CLI to track and apply Copier updates across a fleet of git repositories."
homepage = "https://github.com/shuuchuu/copierz"
license = "Apache-2.0"
license-files = ["LICENSE"]
name = "copierz"
readme = "README.md"
requires-python = ">= 3.13"
version = "0.1.0"

[project.scripts]
copierz = "copierz.cli:main"

[dependency-groups]
dev = [
  "bumpver >= 2026.1132",
  "doit >= 0.37",
  "pytest >= 9",
  "ruff >= 0.17",
  "ty >= 0.0.88",
]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
ignore = [
  "D1",
  "incorrect-blank-line-before-class",
  "multi-line-summary-second-line",
  "non-empty-init-module",
]
preview = true
select = ["A", "B", "C", "D", "DOC", "E", "EM", "F", "I", "N", "PIE", "PTH", "RET", "RUF", "SIM", "SLF", "TC", "UP", "W"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[bumpver]
commit = true
tag = true
push = true
commit_message = "Bump version to {new_version}"
current_version = "0.1.0"
pre_commit_hook = "scripts/bumpver_pre_commit.sh"
tag_message = "{new_version}"
version_pattern = "MAJOR.MINOR.PATCH"

[bumpver.file_patterns]
"pyproject.toml" = [
  '^version = "{version}"$',
  '^current_version = "{version}"$',
]
"src/copierz/__init__.py" = [
  '^__version__ = "{version}"$',
]

[build-system]
build-backend = "uv_build"
requires = ["uv_build>=0.13.1,<0.14.0"]
